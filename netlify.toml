[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The TinaCMS editor screen. It is a login page, not content, so it should
# never turn up in a search result. Keeping it out of robots.txt on purpose:
# robots.txt is public, and listing the path there would advertise it.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
