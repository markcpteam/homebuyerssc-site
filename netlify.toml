[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ---------------------------------------------------------------
    # PRE-LAUNCH ONLY. Keeps search engines out of the temporary
    # netlify.app address so they do not index a duplicate of the site.
    # DELETE THE NEXT LINE on cutover day, right after DNS points
    # homebuyerssc.com at Netlify. Leaving it in will hide the real
    # site from Google entirely.
    # ---------------------------------------------------------------